# LESSONS LEDGER: every defect found (by the user, QC or review) becomes a rule with an automated check.
# A lesson is "closed" only when its check exists, runs in the pipeline (previs/QC/merge gate) and fails on the
# original defect. The director and every agent brief read the open + closed rules (factory/lessons/__init__.py).
# Fields: id, found (who/when), symptom, root_cause, rule, check (how it is enforced), gate (where), status.

- id: L001
  found: user, 2026-11-21
  symptom: Character's eyes look "crazy" (wide painted stare); later the MakeHuman face looked uncanny/creepy.
  root_cause: Generated character had painted eyes on a sparse mesh (no eyelids/face rig); realistic generator faces fall in the uncanny valley.
  rule: Heroes must be production rigs with real eyeballs, eyelids and a face rig (CloudRig/ARKit-class). Neutral upper lid covers the top of the iris; no full-sclera stare unless the emotion is shock/fear.
  check: asset gate rejects characters without eye bones/lid controls; face QC measures sclera-above-iris in neutral close-ups (vision rubric item FACE-1).
  gate: [asset, qc]
  status: partially-closed

- id: L002
  found: user, 2026-11-21
  symptom: Scenes didn't match the voiceover; same deck spot and same camera orbit for every beat.
  root_cause: Beats were authored as camera moves, not as story pictures; only 3 motion clips existed.
  rule: Every narration line maps to a picture that shows what the line says; the hero does an action motivated by the line.
  check: director breakdown check (every line -> picture + action); shot validator story-context rule; vision rubric STORY-1 (does the frame show the line?).
  gate: [develop, direct, qc]
  status: closed

- id: L003
  found: user, 2026-11-21
  symptom: Character "doing fucked up movements".
  root_cause: Meshy rig bones were ~35 m long and unconnected so IK never bent; reused canned clips.
  rule: Rigs must pass an IK sanity test (limbs bend, targets reached within 2 cm) before use; performances are authored per shot.
  check: cloud/blender/test/cloudrig_adapter_test.py (12-pose IK reach test) in the merge gate.
  gate: [asset, merge]
  status: closed

- id: L004
  found: user, 2026-11-21
  symptom: Weird close-ups of the character instead of story-first framing; not immersive.
  root_cause: Cameras defaulted to tight orbits around the hero.
  rule: Story-first framing - <= 25% of shots CU or tighter, no more than 3 tight shots in a row, each location established with a wide, hero shots show the island/fires/boat context.
  check: factory/direction/shot_validator.py (C1-C14, CTX) blocks; QC framing check.
  gate: [direct, qc]
  status: closed

- id: L005
  found: user, 2026-11-21
  symptom: Lighting inconsistent and not cinematic across scenes.
  root_cause: Hero-parented camera-relative lights; no sequence lighting.
  rule: One world-fixed key per sequence (azimuth within +-15 deg), motivated sources, face exposure continuity within 1/3 stop between adjacent shots.
  check: python3 cloud/blender/lighting.py --check <episode>; QC face-exposure continuity on plates.
  gate: [direct, qc]
  status: closed

- id: L006
  found: user, 2026-11-21
  symptom: Video would not play / stalled after 11 s on phone.
  root_cause: 43 MB file without faststart; poor streaming profile.
  rule: Deliverables are H.264 High, yuv420p, +faststart, keyframe every 1 s, capped bitrate; a mobile-safe copy accompanies every delivery.
  check: QC video rules (codec/profile/faststart/GOP) on every final; delivery script refuses otherwise.
  gate: [qc, deliver]
  status: open

- id: L007
  found: QC, 2026-11-21
  symptom: Old draft stepped at 10 fps, captions above the safe area, -18.6 LUFS, black first frame, silent start.
  root_cause: Preview hacks reached the final; no automated final checks.
  rule: Finals are true 30 fps (no duplicated frames), captions inside the platform safe area, -14 LUFS +-1 / TP <= -1 dBTP, no black/frozen frames, audio from frame 0.
  check: factory/qc (TECH/CAP/AUDIO rules) - publish blocked on any HARD failure.
  gate: [qc]
  status: closed

- id: L008
  found: user, 2026-11-22
  symptom: Boat is low detail.
  root_cause: Hero vehicle was a box-built placeholder from the early WebGL kit.
  rule: Any asset that appears in close or medium shots must meet the hero-asset bar (bevels, real sub-parts, materials with variation); placeholders are allowed only in previs and are flagged.
  check: asset gate: per-asset 'tier' in catalog (placeholder|previs|hero); shots whose camera distance < 10 m to an asset require tier=hero; golden turnaround renders reviewed.
  gate: [library, direct, merge]
  status: open

- id: L009
  found: user, 2026-11-22
  symptom: When sitting he leans backwards against a blank white box.
  root_cause: Sit stance tuned for the previous rig; seated against an undetailed cabin wall.
  rule: Seated poses sit on a real seat surface (pelvis contact), upright or forward-leaning unless the story says otherwise; backs only rest on detailed surfaces.
  check: pose QC: pelvis-to-seat contact distance < 3 cm, spine pitch within the stance's allowed range; golden pose sheet regression.
  gate: [direct, merge]
  status: open

- id: L010
  found: user, 2026-11-22
  symptom: Hands in weird positions; fingers splayed.
  root_cause: Finger controls never driven; hand targets proportion-mapped from the old rig.
  rule: Every pose has an explicit hand shape (relaxed curl default, never flat-splayed); holding = palm contact with the object.
  check: pose QC: finger curl > threshold unless the shape is open_palm; hand-to-prop contact distance < 2 cm for grips; golden hand sheet regression.
  gate: [direct, merge]
  status: open

- id: L011
  found: user, 2026-11-22
  symptom: Weird expressions.
  root_cause: Emotion poses roughly calibrated on the new rig; no eye convergence/darts.
  rule: Every emotion reads instantly and appealingly (clear brow shape, lid tension, mouth corners, 5-15% asymmetry); eyes converge on a target.
  check: golden face sheet regression + vision rubric FACE-2 per emotion (must name the intended emotion).
  gate: [merge, qc]
  status: open

- id: L012
  found: user + review, 2026-11-22
  symptom: Shots rendered brown/black; close-ups crop the face; some shots failed to render.
  root_cause: Cameras inside geometry; framing tuned for the old hero's proportions; OOM on full island.
  rule: Cameras never inside geometry; close-ups frame forehead-to-chin with headroom using the actual rig's head metrics; every shot renders (no silent failures).
  check: camera collision check vs yacht/set mesh proxies; framing check with rig head metrics; render runner fails the run on any missing plate; memory budget per shot (island LOD).
  gate: [direct, render, qc]
  status: open

- id: L013
  found: lead, 2026-11-22
  symptom: Story schema exceeded the structured-output grammar limit; first live run failed instantly.
  root_cause: Big JSON schemas sent as constrained decoding grammars.
  rule: LLM stages fall back to JSON-in-prompt + local validation when a schema is too large; never fail the run on that.
  check: tests/director (fallback path) in the merge gate.
  gate: [merge]
  status: closed

- id: L014
  found: lead, 2026-11-22
  symptom: Live run cost $5.04 mostly on retries; prompt cache expired between attempts.
  root_cause: 5-minute cache TTL vs 13-minute attempts; checklist only applied after drafting.
  rule: Use 1-hour cache on recipe blocks; put the blocking checklist in the drafting prompt; cheaper model/effort for mechanical stages; per-stage cost ceiling.
  check: run.json cost per stage vs ceiling; alert when attempts > 2.
  gate: [run]
  status: open

- id: L015
  found: lead (Runpod smoke test), 2026-11-22
  symptom: Final GPU frames rendered without the hero; the job reported success.
  root_cause: The farm's library selection missed spec paths prefixed 'library_store/' (hero_v4.blend never shipped) and the renderer only warned when an actor's file was missing.
  rule: Every asset the spec references ships with the job; a missing actor/prop/set is a hard failure, never a silent skip.
  check: render_episode raises on a missing CloudRig character (ALLOW_MISSING_ACTORS=1 only for debugging); presigned.select_library normalises the prefix; QC 'actor present' check on plates (vision rubric + projected-actor mask) - TODO.
  gate: [render, qc]
  status: partially-closed

- id: L016
  found: lead (Runpod smoke test), 2026-11-22
  symptom: Night sky stars smear into streaks under camera motion blur and read as rain.
  root_cause: Final profile enables motion blur; handheld camera rotation during the shutter smears point-like stars.
  rule: Stars/sky must not streak: shorter shutter on night shots with camera rotation, or sky excluded from motion blur, or stars rendered as soft discs that survive blur.
  check: golden 'night sky under motion' frame + vision rubric SKY-1 ("no streaks in the sky unless it rains"); lighting.star_safe_shutter (final profile) sets one shutter per night shot from the 90th-percentile sky speed of the shot's camera rig (streak <= 1.2 px at render resolution, floor 0.06 frame) and keys the star layer down on frames where the keyed camera still smears them; render report lighting.stars records sky px/frame, shutter, streak and dimmed frames (verified on A01b 40-51 with motion blur on).
  gate: [merge, qc]
  status: partially-closed

- id: L017
  found: user, 2026-11-22
  symptom: Hands and palms look weird in ALL scenes (wrists bent, palms facing the wrong way, fingers splayed).
  root_cause: IK placed wrists by position only; palm orientation and finger shapes were never authored per pose.
  rule: Every frame's hands have a valid palm orientation for the pose (relaxed = palms toward thighs, thumbs forward; grips wrap the object; rails = palms down) and a finger shape (relaxed curl by default).
  check: pose_qc palm-normal vs per-shape target (< 25 deg), wrist bend limit, finger curl > threshold; hands close-up golden sheet; vision rubric HANDS-1 on every hero shot keyframe.
  gate: [direct, merge, qc]
  status: open

- id: L018
  found: user, 2026-11-22
  symptom: Facial expressions look like a dummy/mannequin even when the emotion is posed.
  root_cause: Expressions were static held poses; no facial life, no anticipation/overlap, weak eye behaviour.
  rule: Faces are performances: continuous micro-life during holds, brows lead and mouth follows on transitions, eyes dart before expression changes, saccades every 0.5-2 s, never a dead flat neutral mouth.
  check: face-channel temporal variance over every hero shot > threshold (no frozen face > 0.5 s); golden face CLIP (not still) compared over time; vision rubric FACE-3 'reads as alive, not a mannequin' on sampled clip frames.
  gate: [direct, merge, qc]
  status: open

- id: L019
  found: user, 2026-11-22
  symptom: Yacht doors and windows look unrealistic (flat milky panels).
  root_cause: Windows were emissive planes with no interior; doors were flat panels without frames, handles, tracks or gaskets.
  rule: Glazing is real tinted glass with frames and gaskets that reflects the environment; lit windows glow from interior lights behind the glass, never from emissive panels; doors have frames, hardware and thresholds.
  check: asset gate scans hero-tier assets for emissive materials on glass-named objects (fail); golden 'salon door + windows at night' close-up regression; vision rubric ASSET-2 'windows/doors read as real'.
  gate: [asset, merge]
  status: open
