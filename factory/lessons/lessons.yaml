  check: 'catalog ''tier'' (placeholder|previs|hero) + factory/direction/asset_tier.py: camera < 10 m to a non-hero asset or any placeholder -> shot_validator TIER warns in previs, fails in final (regress check before publish); golden yacht_turnaround; tests/direction/test_asset_tier.py'
