# Free (and near-free) compute registry for the Blender render factory.
# Written by the free_compute_hunt brief (factory/briefs/free_compute_hunt.md), verified 2026-11-22
# against provider pages and 2026 trackers (see each entry's `sources`). Narrative: FREE_COMPUTE.md.
#
# Consumed by the compute broker (factory/briefs/compute_broker.md):
#   - only verdict USE is schedulable by default; USE-WITH-CARE needs an explicit opt-in
#     (`--providers <id>` or `enable_with_care: [<id>]`); AVOID is never schedulable.
#   - `free_quota` is the ledger cap; `reset` says when the ledger period rolls over.
#   - `throughput` is the planner's starting estimate; replace it with measured calibration
#     (cloud/farm/jobs.py calibration_from_manifests) after the first real run on that provider.
#   - priority: 1 = fill first. Paid baselines have priority >= 90 and need --allow-paid.
#
# Throughput model (all estimates, Blender 4.2.3 Cycles, Sentinel-class shots):
#   base measurement: 270x480 @16 spp = 8.6-13.5 s/frame on 2 shared x86 threads (docs/farm.md)
#   CPU preview  270x480 @12 spp      ~ 20 vCPU-s/frame (render 16.5 + build/startup amortised)
#   CPU final    1080x1920 @64 spp+OIDN ~ 1100 vCPU-s/frame (x16 pixels, x4 samples, + denoise)
#   Arm (Ampere A1) core              ~ 1.25x the x86 vCPU-seconds
#   GPU final (64 spp + OptiX denoise): RTX 4090 ~25 s, L40S ~28 s, A100 ~45 s, L4/A10G ~50 s,
#     T4 ~150 s, P100 (CUDA only, OIDN on CPU) ~220 s.  GPU preview: 2-5 s (overhead-bound).
#   Ratios from the measured RTX 4090 farm (~40 s/frame at 128 spp, factory/briefs/_gpu_verify.md)
#   and Blender Open Data relative scores.

schema_version: 1
verified_on: "2026-11-22"
blender_version: "4.2.3"
throughput_model:
  cpu_preview_vcpu_s_per_frame: 20
  cpu_final_vcpu_s_per_frame: 1100
  arm_core_factor: 1.25
  gpu_final_s_per_frame: {rtx4090: 25, l40s: 28, a100: 45, l4: 50, a10g: 50, a10: 50, t4: 150, p100: 220, rtx3090: 40, rtx5090: 18, a5000: 60}
  gpu_preview_s_per_frame: {rtx4090: 2, l4: 2.5, a10g: 2.5, t4: 4, p100: 5}

sources:

  # ------------------------------------------------------------------ recurring, free, schedulable
  - id: oracle_a1_always_free
    name: Oracle Cloud Always Free - Ampere A1 (VM.Standard.A1.Flex)
    category: always_free_vm
    type: cpu
    hardware: {cpu: "2 OCPU Ampere Altra (arm64) for Always-Free tenancies; 4 OCPU possibly on PAYG (disputed)", ram_gb: 12, disk_gb: 200, gpu: null}
    free_quota: {amount: "1500 OCPU-hours + 9000 GB-hours", unit: per_month, reset: "calendar month; effectively 2 OCPU/12 GB running 24/7"}
    max_runtime: unlimited (persistent VM)
    concurrency: "1-2 VMs sharing the 2 OCPU / 12 GB allowance"
    cold_start: "none once provisioned; provisioning often fails with 'out of host capacity' in popular regions"
    arbitrary_binaries: true
    container: "yes (Docker/Podman on the VM)"
    arch: arm64
    blender_note: "No official Blender linux-arm64 build exists (blender.org ships x64 only). Need a community/arm64 build of 4.2.3 or a source build; verify pixel parity against x86 goldens before using for finals."
    egress: "10 TB/month outbound free"
    api: "OCI CLI / Terraform (oci_core_instance); worker pulls chunks from the S3 lease queue"
    account: {card: true, phone: true, kyc: "address + card verification; no charge on Always-Free"}
    terms:
      automated_batch_allowed: true
      clause: "Idle Always Free compute instances may be reclaimed by Oracle ... if, during a 7-day period ... CPU utilization for the 95th percentile is less than 20%"
      url: https://docs.oracle.com/en-us/iaas/Content/FreeTier/resourceref.htm
      commercial_use: true
      ban_risk: low
      notes: "A busy render worker is never 'idle'. Allowance was halved from 4 OCPU/24 GB to 2 OCPU/12 GB in mid-2026 (InfoQ, Jun/Aug 2026); exceeding it disables then deletes A1 instances after 30 days."
    setup: ["Sign up for OCI Always Free (pick a home region with A1 capacity, it cannot be changed)", "Create one VM.Standard.A1.Flex 2 OCPU/12 GB Ubuntu 24.04 arm64", "Install arm64 Blender 4.2.3 + factory worker (adapter oracle_always_free)"]
    verdict: USE-WITH-CARE
    verdict_condition: "only after an arm64 Blender 4.2.3 build passes the goldens; stay within 2 OCPU/12 GB"
    throughput: {preview_s_per_frame: 12.5, final_s_per_frame: 690}
    free_frames_month: {preview: 210000, final: 3750}
    adapter: oracle_always_free
    priority: 2
    sources: [https://docs.oracle.com/en-us/iaas/Content/FreeTier/resourceref.htm, https://infoq.com/news/2026/07/oracle-cloud-free-tier-limits/]

